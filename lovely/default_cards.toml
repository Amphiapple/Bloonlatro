[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Default cards if all other cards are not in the pool
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
elseif _type == 'Joker' then _pool[#_pool + 1] = "j_joker"
'''
position = 'after'
payload = '''
elseif _type == 'Power' then _pool[#_pool + 1] = "c_bloons_super_monkey_storm"
elseif _type == 'Upgrade' then _pool[#_pool + 1] = "c_bloons_upgrade_select"
'''
match_indent = true
